<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="740" viewBox="0 0 1400 740" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#212529"/>
    </marker>
    <style>
      .blk  { stroke:#212529; stroke-width:2.5; }
      .wire { stroke:#212529; stroke-width:2.5; fill:none; }
      .dash { stroke:#212529; stroke-width:2; fill:none; stroke-dasharray:7 5; }
      .t    { font-size:17px; font-weight:bold; text-anchor:middle; }
      .s    { font-size:13px; text-anchor:middle; }
      .lbl  { font-size:12.5px; fill:#212529; }
      .gain { font-size:14px; font-weight:bold; text-anchor:middle; fill:#C92A2A; }
      .dark { fill:#111111; }
      .lite { fill:#FFFFFF; }
    </style>
  </defs>

  <rect width="1400" height="740" fill="#FFFFFF"/>

  <!-- title -->
  <text x="30" y="48" font-size="26" font-weight="bold" fill="#111">uDSR direct-sampling HF receiver</text>
  <text x="30" y="74" font-size="15" fill="#495057">Block diagram · VK7IAN</text>

  <!-- ================= RF CHAIN ================= -->
  <!-- antenna -->
  <g class="wire">
    <line x1="50" y1="118" x2="50" y2="198"/>
    <line x1="50" y1="138" x2="30" y2="110"/>
    <line x1="50" y1="138" x2="70" y2="110"/>
    <line x1="50" y1="198" x2="95" y2="198" marker-end="url(#ah)"/>
  </g>
  <text x="50" y="222" class="s dark" font-weight="bold">Antenna</text>

  <rect x="95"  y="150" width="150" height="96" rx="10" fill="#FF7A00" class="blk"/>
  <text x="170" y="190" class="t dark">HV protection</text>
  <text x="170" y="212" class="t dark">diodes</text>

  <line x1="245" y1="198" x2="285" y2="198" class="wire" marker-end="url(#ah)"/>
  <rect x="285" y="150" width="150" height="96" rx="10" fill="#FF7A00" class="blk"/>
  <text x="360" y="190" class="t dark">Band-pass</text>
  <text x="360" y="212" class="t dark">filter</text>

  <line x1="435" y1="198" x2="475" y2="198" class="wire" marker-end="url(#ah)"/>
  <rect x="475" y="150" width="150" height="96" rx="10" fill="#FF7A00" class="blk"/>
  <text x="550" y="190" class="t dark">MMIC</text>
  <text x="550" y="212" class="s dark">low-noise amplifier</text>

  <line x1="625" y1="198" x2="665" y2="198" class="wire" marker-end="url(#ah)"/>
  <rect x="665" y="150" width="170" height="96" rx="10" fill="#FF7A00" class="blk"/>
  <text x="750" y="190" class="t dark">16:1 transformer</text>
  <text x="750" y="212" class="s dark">single-ended → differential</text>

  <!-- differential pair -->
  <line x1="835" y1="188" x2="875" y2="188" class="wire" marker-end="url(#ah)"/>
  <line x1="835" y1="208" x2="875" y2="208" class="wire" marker-end="url(#ah)"/>

  <rect x="875" y="150" width="170" height="96" rx="10" fill="#9C36B5" class="blk"/>
  <text x="960" y="186" class="t lite">10-bit ADC</text>
  <text x="960" y="207" class="s lite">81 MSPS</text>
  <text x="960" y="225" class="s lite">1 Vpp differential</text>

  <!-- ADC data bus -->
  <line x1="1045" y1="198" x2="1090" y2="198" class="wire" stroke-width="4" marker-end="url(#ah)"/>
  <line x1="1060" y1="208" x2="1070" y2="188" class="wire" stroke-width="2"/>
  <text x="1066" y="182" class="lbl" text-anchor="middle">10</text>

  <!-- gain strip -->
  <text x="360" y="276" class="gain">≈ −1 dB</text>
  <text x="550" y="276" class="gain">+20 dB</text>
  <text x="750" y="276" class="gain">+12 dB</text>
  <text x="95" y="306" font-size="13.5" fill="#343A40">Net gain ≈ +30.5 dB antenna → ADC  ·  system NF ≈ 12 dB  ·  ADC full scale ≈ −26.5 dBm at the antenna (S9+46)  (estimates)</text>

  <!-- ================= CLOCK ================= -->
  <rect x="1145" y="48" width="160" height="40" rx="8" fill="#FCC419" class="blk"/>
  <text x="1225" y="74" class="t dark" font-size="15">27 MHz osc</text>
  <line x1="1225" y1="88" x2="1225" y2="110" class="wire" marker-end="url(#ah)"/>

  <!-- ADC sample clock from FPGA PLL -->
  <path d="M1090,345 L960,345 L960,246" class="dash" marker-end="url(#ah)"/>
  <text x="968" y="336" class="lbl">81 MHz ADC clock</text>

  <!-- ================= FPGA ================= -->
  <rect x="1090" y="110" width="270" height="260" rx="12" fill="#1971C2" class="blk"/>
  <text x="1225" y="138" class="t lite" font-size="19">GOWIN FPGA</text>
  <text x="1225" y="158" class="s lite">DDC26 digital down-converter</text>
  <g font-size="13.5" text-anchor="middle" fill="#0B3D78" font-weight="bold">
    <rect x="1110" y="172" width="230" height="30" rx="6" fill="#FFFFFF" stroke="#0B3D78" stroke-width="1.5"/>
    <text x="1225" y="192">rPLL  27 → 81 MHz</text>
    <rect x="1110" y="210" width="230" height="30" rx="6" fill="#FFFFFF" stroke="#0B3D78" stroke-width="1.5"/>
    <text x="1225" y="230">NCO + I/Q mixer</text>
    <rect x="1110" y="248" width="230" height="30" rx="6" fill="#FFFFFF" stroke="#0B3D78" stroke-width="1.5"/>
    <text x="1225" y="268">CIC 3-stage  ÷432</text>
    <rect x="1110" y="286" width="230" height="30" rx="6" fill="#FFFFFF" stroke="#0B3D78" stroke-width="1.5"/>
    <text x="1225" y="306">FIR 252-tap  ÷6</text>
    <rect x="1110" y="324" width="230" height="30" rx="6" fill="#FFFFFF" stroke="#0B3D78" stroke-width="1.5"/>
    <text x="1225" y="344">SPI · 16-bit I/Q @ 31.25 kHz</text>
  </g>

  <!-- ================= SPI LINK ================= -->
  <line x1="1140" y1="370" x2="1140" y2="450" class="wire" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="1225" y1="450" x2="1225" y2="370" class="wire" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="1310" y1="370" x2="1310" y2="450" class="dash" marker-end="url(#ah)"/>
  <text x="1133" y="414" class="lbl" font-weight="bold" text-anchor="end">I/Q</text>
  <text x="1218" y="414" class="lbl" font-weight="bold" text-anchor="end">tuning word</text>
  <text x="1317" y="414" class="lbl" font-weight="bold">DR</text>
  <text x="1070" y="390" class="lbl" text-anchor="end" font-weight="bold">Bidirectional SPI · PIO AsyncSPI 6 MHz</text>
  <text x="1070" y="408" class="lbl" text-anchor="end">↓ I/Q 2 × 16-bit   ↑ 32-bit NCO tuning word</text>
  <text x="1070" y="426" class="lbl" text-anchor="end">DR: data-ready strobe at 31.25 kHz</text>

  <!-- ================= RP2350 ================= -->
  <rect x="1090" y="450" width="270" height="240" rx="12" fill="#2B8A3E" class="blk"/>
  <text x="1225" y="480" class="t lite" font-size="20">RP2350</text>
  <text x="1225" y="499" class="s lite">Seeed XIAO · 250 MHz</text>
  <g font-size="13.5" fill="#FFFFFF" text-anchor="middle">
    <text x="1225" y="534" font-weight="bold">Core 1 · DSP</text>
    <text x="1225" y="552">SSB · CW · AM · AGC · NB · notch</text>
    <text x="1225" y="586" font-weight="bold">Core 0 · UI</text>
    <text x="1225" y="604">tuning · menu · 1024-pt spectrum</text>
    <text x="1225" y="638" font-weight="bold">Peripherals</text>
    <text x="1225" y="656">PIO SPI · PWM · ADC0 · I²C</text>
  </g>

  <!-- ================= LEFT COLUMN ================= -->
  <!-- OLED -->
  <rect x="800" y="465" width="200" height="54" rx="10" fill="#FCC419" class="blk"/>
  <text x="900" y="488" class="t dark">OLED 128 × 32</text>
  <text x="900" y="507" class="s dark">display</text>
  <line x1="1090" y1="492" x2="1000" y2="492" class="wire" marker-end="url(#ah)"/>
  <text x="1045" y="484" class="lbl" text-anchor="middle">I²C</text>

  <!-- audio chain -->
  <line x1="1090" y1="565" x2="1000" y2="565" class="wire" marker-end="url(#ah)"/>
  <line x1="1090" y1="585" x2="1000" y2="585" class="wire" marker-end="url(#ah)"/>
  <text x="1045" y="557" class="lbl" text-anchor="middle">PWM H</text>
  <text x="1045" y="602" class="lbl" text-anchor="middle">PWM L</text>

  <rect x="800" y="545" width="200" height="60" rx="10" fill="#D6336C" class="blk"/>
  <text x="900" y="570" class="t lite">RC low-pass</text>
  <text x="900" y="590" class="s lite">sums 6-bit H + 6-bit L</text>

  <line x1="800" y1="575" x2="740" y2="575" class="wire" marker-end="url(#ah)"/>
  <rect x="580" y="545" width="160" height="60" rx="10" fill="#D6336C" class="blk"/>
  <text x="660" y="581" class="t lite">Audio amp</text>

  <line x1="580" y1="575" x2="532" y2="575" class="wire" marker-end="url(#ah)"/>
  <!-- headphones icon -->
  <g fill="none" stroke="#212529" stroke-width="4" stroke-linecap="round">
    <path d="M470,585 L470,568 A28,28 0 0 1 526,568 L526,585"/>
  </g>
  <rect x="461" y="575" width="16" height="24" rx="4" fill="#D6336C" stroke="#212529" stroke-width="2.5"/>
  <rect x="519" y="575" width="16" height="24" rx="4" fill="#D6336C" stroke="#212529" stroke-width="2.5"/>
  <text x="498" y="622" class="s dark" font-weight="bold">Headphones</text>

  <!-- encoder chain -->
  <rect x="580" y="625" width="160" height="60" rx="10" fill="#FCC419" class="blk"/>
  <text x="660" y="650" class="t dark">Rotary encoder</text>
  <text x="660" y="670" class="s dark">common → 3.3 V</text>

  <line x1="740" y1="645" x2="800" y2="645" class="wire" marker-end="url(#ah)"/>
  <line x1="740" y1="665" x2="800" y2="665" class="wire" marker-end="url(#ah)"/>
  <text x="770" y="639" class="lbl" text-anchor="middle">A</text>
  <text x="770" y="682" class="lbl" text-anchor="middle">B</text>

  <rect x="800" y="625" width="200" height="60" rx="10" fill="#FCC419" class="blk"/>
  <text x="900" y="650" class="t dark">Resistor network</text>
  <text x="900" y="670" class="s dark">R / 2R / R → 4 levels</text>

  <line x1="1000" y1="655" x2="1090" y2="655" class="wire" marker-end="url(#ah)"/>
  <text x="1045" y="647" class="lbl" text-anchor="middle">ADC0</text>

  <!-- push button -->
  <path d="M660,685 L660,716 L1225,716 L1225,690" class="dash" marker-end="url(#ah)"/>
  <text x="900" y="710" class="lbl" text-anchor="middle">encoder push button → D7</text>

  <!-- ================= LEGEND ================= -->
  <g font-size="14" fill="#212529">
    <text x="40" y="430" font-weight="bold" font-size="15">Key</text>
    <rect x="40" y="444" width="22" height="16" rx="3" fill="#FF7A00" stroke="#212529" stroke-width="1.5"/>
    <text x="72" y="457">RF front end</text>
    <rect x="40" y="470" width="22" height="16" rx="3" fill="#9C36B5" stroke="#212529" stroke-width="1.5"/>
    <text x="72" y="483">A/D conversion</text>
    <rect x="40" y="496" width="22" height="16" rx="3" fill="#1971C2" stroke="#212529" stroke-width="1.5"/>
    <text x="72" y="509">FPGA signal processing</text>
    <rect x="40" y="522" width="22" height="16" rx="3" fill="#2B8A3E" stroke="#212529" stroke-width="1.5"/>
    <text x="72" y="535">Microcontroller</text>
    <rect x="40" y="548" width="22" height="16" rx="3" fill="#D6336C" stroke="#212529" stroke-width="1.5"/>
    <text x="72" y="561">Audio output</text>
    <rect x="40" y="574" width="22" height="16" rx="3" fill="#FCC419" stroke="#212529" stroke-width="1.5"/>
    <text x="72" y="587">User interface &amp; clock</text>
    <line x1="40" y1="612" x2="62" y2="612" class="dash"/>
    <text x="72" y="617">clock / control signal</text>
  </g>
</svg>
